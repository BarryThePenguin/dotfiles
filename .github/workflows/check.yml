name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MISE_IGNORED_CONFIG_PATHS: .config/mise/config.toml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: pnpm install --frozen-lockfile

      - run: hk check --all

name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MISE_IGNORED_CONFIG_PATHS: .config/mise/config.toml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5

      - run: pnpm install --frozen-lockfile

      - run: hk check --all

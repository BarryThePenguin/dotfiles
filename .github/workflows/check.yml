name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MISE_IGNORED_CONFIG_PATHS: .config/mise/config.toml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5

      - run: hk check --all

[env]
EDITOR = "code"

[plugins]
repo-bins = "~/src/btp/agent-tools/mise-repo-bins"

[tools]
repo-bins = "local"
"npm:@typespec/compiler" = { version = "1.17.0", os = ["macos"] }
"npm:prettier" = { version = "3.9.10", os = ["macos"] }
"npm:typescript-language-server" = { version = "6.0.2", os = ["macos"] }
"npm:typescript" = { version = "7.0.2", os = ["macos"] }
"cargo:forgejo-cli" = { version = "0.7.0", os = ["macos"] }
"github:asciimoo/hister" = { version = "0.21.0", os = ["macos"] }
age = { version = "1.3.2", os = ["macos"] }
ast-grep = { version = "0.51.0", os = ["macos"] }
atuin = { version = "18.24.2", os = ["macos"] }
aube = { version = "v2.8.4", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"], os = ["macos"] }
cloudflared = { version = "2026.10.5", os = ["macos"] }
flux2 = { version = "2.10.0", os = ["macos"] }
fnox = { version = "v1.43.0", workflow = "release.yml", os = ["macos"] }
gh = { version = "2.103.3", os = ["macos"] }
go = { version = "1.27.3", os = ["macos"] }
hk = { version = "2.8.0", os = ["macos"] }
java = { version = "27.0.1", os = ["macos"] }
jq = { version = "1.8.2", os = ["macos"] }
mkcert = { version = "1.4.4", os = ["macos"] }
mr-boxington = { version = "v1.28.0", workflow = "release.yml@refs/heads/main", os = ["macos"] }
node = { version = "26.12.1", os = ["macos"] }
pi = { version = "v1.4.0", os = ["macos"] }
podman = { version = "v6.1.4", os = ["macos"] }
python = { version = "3.15.2", os = ["macos"] }
ripgrep = { version = "15.2.0", os = ["macos"] }
rust = { version = "1.99.1", mr_boxington = true, os = ["macos"] }
shellcheck = { version = "0.11.0", os = ["macos"] }
sops = { version = "3.13.3", os = ["macos"] }
starship = { version = "1.27.0", os = ["macos"] }
usage = { version = "7.1.3", workflow = "publish-cli.yml", os = ["macos"] }
uv = { version = "0.13.6", os = ["macos"] }
watchexec = { version = "2.8.0", os = ["macos"] }
workmux = { version = "v0.1.277", os = ["macos"] }
yq = { version = "4.54.1", os = ["macos"] }
zellij = { version = "0.45.1", os = ["macos"] }
cargo-binstall = { version = "1.26.1", os = ["macos"] }

[settings]
self_update.auto = true
dotfiles.root = "~/src/btp/dotfiles"
lockfile_mode = "generate"
lockfile_platforms = ["macos-arm64", "linux-x64"]

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[bootstrap.macos.finder]
show_pathbar = true

[bootstrap.macos.defaults]
"com.apple.Finder" = { AppleShowAllFiles = true }

[bootstrap.repos]
"~/.config/zsh/.zprezto" = { url = "https://github.com/sorin-ionescu/prezto.git", ref = "master" }
"~/.config/ghostty/themes" = { url = "https://github.com/dracula/ghostty.git", ref = "main" }
"~/.config/opencode/themes" = { url = "https://github.com/dracula/opencode.git", ref = "main" }
"~/.config/base16-shell" = { url = "https://github.com/chriskempson/base16-shell.git", ref = "master" }
"~/.zprezto-contrib/zsh-notify" = { url = "https://github.com/marzocchi/zsh-notify.git", ref = "master" }
"~/src/btp/advent-of-code" = { url = "https://github.com/BarryThePenguin/advent-of-code.git", ref = "main" }
"~/src/btp/agent-tools" = { url = "ssh://git@git.jonno.dev/BarryThePenguin/agent-tools.git", ref = "main" }
"~/src/btp/gillyreads.com" = { url = "https://github.com/BarryThePenguin/gillyreads.com.git", ref = "main" }
"~/src/btp/homelab" = { url = "ssh://git@git.jonno.dev/BarryThePenguin/homelab.git", ref = "main" }
"~/src/btp/skills" = { url = "ssh://git@git.jonno.dev/BarryThePenguin/skills.git", ref = "main" }
"~/src/btp/renovate-config" = { url = "ssh://git@git.jonno.dev/BarryThePenguin/renovate-config.git", ref = "main" }
"~/src/btp/simple-desktop-images" = { url = "https://github.com/BarryThePenguin/simple-desktop-images.git", ref = "main" }
"~/src/btp/woodpecker-plugins" = { url = "ssh://git@git.jonno.dev/BarryThePenguin/woodpecker-plugins.git", ref = "main" }
"~/src/hono/hono" = { url = "https://github.com/BarryThePenguin/hono.git", ref = "main" }
"~/src/hono/middleware" = { url = "https://github.com/BarryThePenguin/middleware.git", ref = "main" }
"~/src/hono/vite-plugins" = { url = "https://github.com/BarryThePenguin/vite-plugins.git", ref = "main" }

[bootstrap.hooks.post-repos]
run = "git -C ~/.config/zsh/.zprezto submodule update --init --recursive"

[bootstrap.hooks.pre-dotfiles]
run = "~/src/btp/dotfiles/.config/mise/tasks/age/key"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:gnupg" = "latest"
"apt:openssh-client" = "latest"

"brew:coreutils" = "latest"
"brew:git" = "latest"
"brew:jj" = "latest"
"brew:mas" = "latest"
"brew:dekit" = "latest"
"brew:terminal-notifier" = "latest"
"brew:watchman" = "latest"
"brew:xorriso" = "latest"
"brew:yazi" = "latest"
"brew:zsh" = "latest"

"brew-cask:1password-cli" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:atuin-desktop" = "latest"
"brew-cask:bruno" = "latest"
# "brew-cask:cyberduck" = "latest"
"brew-cask:dbeaver-community" = "latest"
"brew-cask:firefox@developer-edition" = "latest"
"brew-cask:flux-app" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:github" = "latest"
# "brew-cask:gpg-suite-no-mail" = "latest"
# "brew-cask:keybase" = "latest"
"brew-cask:macpass" = "latest"
"brew-cask:podman-desktop" = "latest"
"brew-cask:todoist-app" = "latest"
"brew-cask:visual-studio-code" = "latest"

"mas:1518425043" = "latest" # Boop
"mas:6454431289" = "latest" # CrystalFetch
"mas:411643860" = "latest" # DaisyDisk
"mas:430798174" = "latest" # HazeOver
"mas:441258766" = "latest" # Magnet
"mas:425424353" = "latest" # The Unarchiver
"mas:497799835" = "latest" # Xcode
"mas:6758597144" = "latest" # Mindwtr

[dotfiles]
"~/.agents/skills" = { source = "~/src/btp/skills/skills", mode = "symlink-each", manifest = "git" }
"~/.claude/agents" = { mode = "track" }
"~/.claude/settings.json" = { mode = "track" }
"~/.claude/statusline-command.sh" = { mode = "track" }
"~/.config/1Password" = { mode = "symlink-each", manifest = "git" }
"~/.config/atuin/config.toml" = { mode = "symlink" }
"~/.config/fnox/age.txt" = { source = "~/.config/sops/age/keys.txt", mode = "symlink" }
"~/.config/fnox/config.toml" = { mode = "symlink" }
"~/.config/gh" = { mode = "symlink-each", manifest = "git" }
"~/.config/gh/hosts.yml" = { mode = "track" }
"~/.config/ghostty/config" = { mode = "symlink" }
"~/.config/git/btp.gitconfig" = { mode = "symlink" }
"~/.config/git/config" = { mode = "template" }
"~/.config/git/ignore" = { mode = "symlink" }
"~/.config/git/work.gitconfig" = { mode = "symlink" }
"~/.config/gpg/gpg-agent.conf" = { mode = "symlink" }
"~/.config/gpg/gpg.conf" = { mode = "symlink" }
"~/.config/hk" = { mode = "symlink-each", manifest = "git" }
"~/.config/hister/config.yml" = { mode = "symlink" }
"~/.config/homebrew/Brewfile" = { mode = "symlink" }
"~/.config/jj/config.toml" = { mode = "symlink" }
"~/.config/kube/config" = { mode = "track" }
"~/.config/mise" = { mode = "symlink-each", manifest = "git" }
"~/.config/mise/age.txt" = { source = "~/.config/sops/age/keys.txt", mode = "symlink" }
"~/.config/starship/starship.toml" = { mode = "symlink" }
"~/.config/workmux/config.yaml" = { mode = "symlink" }
"~/.config/zellij" = { mode = "symlink-each", manifest = "git" }
"~/.config/zsh" = { mode = "symlink-each", manifest = "git" }
"~/.pi/agent/agents" = { source = "~/src/btp/agent-tools/subagent-pi/agents", mode = "symlink" }
"~/.pi/agent/extensions/issue-tools-pi" = { source = "~/src/btp/agent-tools/issue-tools-pi", mode = "symlink" }
"~/.pi/agent/extensions/subagent-pi" = { source = "~/src/btp/agent-tools/subagent-pi", mode = "symlink" }
"~/.pi/agent/prompts" = { source = "~/src/btp/agent-tools/subagent-pi/prompts", mode = "symlink" }
"~/.pi/agent/skills" = { source = "~/src/btp/skills/skills", mode = "symlink-each", manifest = "git" }
"~/.ssh/config" = { source = "~/src/btp/dotfiles/.config/ssh/config", mode = "symlink" }
"~/.wakatime.cfg" = { mode = "track" }
"~/.zprezto-contrib" = { mode = "symlink-each", manifest = "git" }
"~/.zshenv" = { mode = "symlink" }
"~/AGENTS.md" = { source = "~/src/btp/dotfiles/home/AGENTS.md", mode = "symlink" }
"~/.config/agents" = { source = "~/src/btp/dotfiles/home/agents", mode = "symlink" }

[dotfile_groups.home]
root = "home"
target = "~"
exclude = ["AGENTS.md"]

[dotfile_groups.home.entries]
"~/.config/zellij/layouts/default.kdl" = { source = "~/src/btp/dotfiles/.config/zellij/layouts/home.kdl", mode = "symlink" }
"~/.config/opencode/cli.json" = { source = "~/src/btp/dotfiles/.config/opencode/cli.json", mode = "symlink" }
"~/.config/opencode/opencode.jsonc" = { source = "~/src/btp/dotfiles/.config/opencode/opencode.jsonc", mode = "symlink" }
"~/.config/opencode/plugins/caffeinate.ts" = { source = "~/src/btp/dotfiles/.config/opencode/plugins/caffeinate.ts", mode = "symlink" }
"~/.config/opencode/plugins/issue-tools.ts" = { source = "~/src/btp/agent-tools/issue-tools-opencode/src/index.ts", mode = "symlink" }
"~/.config/opencode/skills" = { source = "~/src/btp/skills/skills", mode = "symlink-each", manifest = "git" }
"~/.config/opencode/tui.json" = { source = "~/src/btp/dotfiles/.config/opencode/tui.json", mode = "symlink" }

[dotfile_groups.work]
root = "work"
target = "~"

[dotfile_groups.work.entries]
"~/.config/zellij/layouts/default.kdl" = { source = "~/src/btp/dotfiles/.config/zellij/layouts/work.kdl", mode = "symlink" }
"~/.mcp.json" = { source = "~/src/btp/dotfiles/.mcp.json", mode = "symlink" }
"~/CLAUDE.md" = { mode = "symlink" }
"~/.claude/skills" = { source = "~/src/btp/skills/skills", mode = "symlink-each", manifest = "git" }

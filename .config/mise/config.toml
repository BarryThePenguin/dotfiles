[env]
EDITOR = "code"
OTEL_EXPORTER_OTLP_ENDPOINT = "{{ get_env(name='OTEL_EXPORTER_OTLP_ENDPOINT', default='http://localhost:4318') }}"
OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf"
OTEL_EXPORTER_OTLP_TIMEOUT = "500"

[tools]
"cargo:forgejo-cli" = { version = "0.7.0", os = ["macos"] }
"github:asciimoo/hister" = { version = "0.21.0", os = ["macos"] }
"github:open-telemetry/opentelemetry-collector-releases" = { version = "v0.165.0", matching_regex = "^otelcol-contrib_", os = ["macos"] }
"npm:@btp/catalogue" = "1.2.0"
"npm:@btp/catalogue-mcp" = "1.1.0"
"npm:@btp/ci-cli" = "1.0.0"
"npm:@btp/doist-cli" = "1.0.0"
"npm:@btp/doist-mcp" = "1.0.3"
"npm:@btp/file-size-cli" = "1.0.0"
"npm:@btp/hub" = "1.0.1"
"npm:@btp/issue-tools-claude" = "1.0.1"
"npm:@btp/nms-save-cli" = "1.0.0"
"npm:@btp/mq-cli" = "1.0.0"
"npm:@btp/mq-mcp" = "1.0.0"
"npm:@btp/onix" = "1.0.0"
"npm:@btp/opencode-go-usage" = "1.0.0"
"npm:@btp/skills-cli" = "1.0.0"
"npm:@typespec/compiler" = { version = "1.18.0", os = ["macos"] }
"npm:prettier" = { version = "3.10.1", os = ["macos"] }
"npm:typescript-language-server" = { version = "6.1.0", os = ["macos"] }
"npm:typescript" = { version = "7.0.2", os = ["macos"] }
age = { version = "1.3.2", os = ["macos"] }
ast-grep = { version = "0.51.2", os = ["macos"] }
atuin = { version = "18.24.7", os = ["macos"] }
aube = { version = "v2.10.0", workflow = ["release-plz.yml@refs/heads/main", "release.yml@refs/heads/main"], os = ["macos"] }
cloudflared = { version = "2026.10.7", os = ["macos"] }
flux2 = { version = "2.10.0", os = ["macos"] }
fnox = { version = "v1.48.0", workflow = "release.yml", os = ["macos"] }
gh = { version = "2.103.3", os = ["macos"] }
go = { version = "1.27.4", os = ["macos"] }
golangci-lint = { version = "2.15.0", os = ["macos"] }
hk = { version = "2.11.1", os = ["macos"] }
java = { version = "27.0.1", os = ["macos"] }
jq = { version = "1.8.2", os = ["macos"] }
mkcert = { version = "1.4.4", os = ["macos"] }
mr-boxington = { version = "v1.30.0", workflow = "release.yml@refs/heads/main", os = ["macos"] }
node = { version = "26.13.1", os = ["macos"] }
pi = { version = "v1.5.2", os = ["macos"] }
podman = { version = "v6.2.0", os = ["macos"] }
python = { version = "3.15.2", os = ["macos"] }
ripgrep = { version = "15.2.0", os = ["macos"] }
rust = { version = "1.100.0", mr_boxington = true, os = ["macos"] }
shellcheck = { version = "0.11.0", os = ["macos"] }
sops = { version = "3.13.3", os = ["macos"] }
starship = { version = "1.27.0", os = ["macos"] }
usage = { version = "7.3.0", workflow = "publish-cli.yml", os = ["macos"] }
uv = { version = "0.13.7", os = ["macos"] }
watchexec = { version = "2.8.0", os = ["macos"] }
workmux = { version = "v0.1.282", os = ["macos"] }
yq = { version = "4.54.3", os = ["macos"] }
zellij = { version = "0.46.0", os = ["macos"] }
cargo-binstall = { version = "1.27.0", os = ["macos"] }

[settings]
self_update.auto = true
dotfiles.root = "~/src/btp/dotfiles"
lockfile_mode = "generate"
lockfile_platforms = ["macos-arm64", "linux-x64"]

[bootstrap.settings.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[bootstrap.settings.macos.finder]
show_pathbar = true

[bootstrap.settings.macos.defaults]
"com.apple.Finder" = { AppleShowAllFiles = true }

[bootstrap.repos]
"~/.config/zsh/.zprezto" = { url = "https://github.com/sorin-ionescu/prezto.git", ref = "master" }
"~/.config/ghostty/themes" = { url = "https://github.com/dracula/ghostty.git", ref = "main" }
"~/.config/opencode/themes" = { url = "https://github.com/dracula/opencode.git", ref = "main" }
"~/.config/base16-shell" = { url = "https://github.com/chriskempson/base16-shell.git", ref = "master" }
"~/.zprezto-contrib/zsh-notify" = { url = "https://github.com/marzocchi/zsh-notify.git", ref = "master" }
"~/src/btp/advent-of-code" = { url = "https://github.com/BarryThePenguin/advent-of-code.git", ref = "main" }
"~/src/btp/gillyreads.com" = { url = "https://github.com/BarryThePenguin/gillyreads.com.git", ref = "main" }
"~/src/btp/home" = { url = "ssh://git@git.jonno.dev/btp/home.git", ref = "main" }
"~/src/btp/simple-desktop-images" = { url = "https://github.com/BarryThePenguin/simple-desktop-images.git", ref = "main" }
"~/src/hono/hono" = { url = "https://github.com/BarryThePenguin/hono.git", ref = "main" }
"~/src/hono/middleware" = { url = "https://github.com/BarryThePenguin/middleware.git", ref = "main" }
"~/src/hono/vite-plugins" = { url = "https://github.com/BarryThePenguin/vite-plugins.git", ref = "main" }

[bootstrap.hooks.post-repos]
run = "git -C ~/.config/zsh/.zprezto submodule update --init --recursive"

[bootstrap.hooks.pre-dotfiles]
run = "~/src/btp/dotfiles/.config/mise/tasks/age/key"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:gnupg" = "latest"
"apt:openssh-client" = "latest"

"brew:coreutils" = "latest"

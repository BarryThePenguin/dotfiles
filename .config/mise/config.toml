[env]
_.file = "~/.config/mise/.env"
EDITOR = "code"

[plugins]
repo-bins = "~/src/btp/agent-tools/mise-repo-bins"

[tools]
repo-bins = "local"
"npm:@typespec/compiler" = { version = "1.16.0", os = ["macos"] }
"npm:prettier" = { version = "3.9.8", os = ["macos"] }
"npm:typescript-language-server" = { version = "6.0.0", os = ["macos"] }
"npm:typescript" = { version = "7.0.2", os = ["macos"] }
"cargo:forgejo-cli" = { version = "0.6.0", os = ["macos"] }
age = { version = "1.3.2", os = ["macos"] }
atuin = { version = "18.22.0", os = ["macos"] }
aube = { version = "v2.2.16", os = ["macos"] }
cloudflared = { version = "2026.9.1", os = ["macos"] }
flux2 = { version = "2.9.5", os = ["macos"] }
fnox = { version = "1.35.2", os = ["macos"] }
gh = { version = "2.100.0", os = ["macos"] }
go = { version = "1.27.1", os = ["macos"] }
helm = { version = "4.3.0", os = ["macos"] }
hk = { version = "2.0.0", os = ["macos"] }
java = { version = "27.0.0", os = ["macos"] }
jq = { version = "1.8.2", os = ["macos"] }
kind = { version = "0.33.0", os = ["macos"] }
lima = { version = "2.2.0", os = ["macos"] }
mkcert = { version = "1.4.4", os = ["macos"] }
node = { version = "26", os = ["macos"] }
pi = { version = "0.85.1", os = ["macos"] }
podman = { version = "6.1.1", os = ["macos"] }
python = { version = "3.14.7", os = ["macos"] }
ripgrep = { version = "15.2.0", os = ["macos"] }
rust = { version = "1.98.1", os = ["macos"] }
shellcheck = { version = "0.11.0", os = ["macos"] }
sops = { version = "3.13.3", os = ["macos"] }
starship = { version = "1.26.0", os = ["macos"] }
usage = { version = "6.9.0", os = ["macos"] }
uv = { version = "0.12.13", os = ["macos"] }
workmux = { version = "v0.1.259", os = ["macos"] }
yq = { version = "4.53.6", os = ["macos"] }
zellij = { version = "0.45.1", os = ["macos"] }

[settings]
auto_update = true
dotfiles.root = "~/src/btp/dotfiles"

[task_config]
includes = [".config/mise/tasks/dotfiles.toml"]

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15

[bootstrap.macos.finder]
show_pathbar = true

[bootstrap.macos.defaults]
"com.apple.Finder" = { AppleShowAllFiles = true }

[bootstrap.repos]
"~/.config/zsh/.zprezto" = { url = "https://github.com/sorin-ionescu/prezto.git", ref = "master" }
"~/.config/ghostty/themes" = { url = "https://github.com/dracula/ghostty.git", ref = "main" }
"~/.config/opencode/themes" = { url = "https://github.com/dracula/opencode.git", ref = "main" }
"~/.config/base16-shell" = { url = "https://github.com/chriskempson/base16-shell.git", ref = "master" }
"~/src/btp/dotfiles/.zprezto-contrib/zsh-notify" = { url = "https://github.com/marzocchi/zsh-notify.git", ref = "master" }

[bootstrap.hooks.post-repos]
run = "git -C ~/.config/zsh/.zprezto submodule update --init --recursive"

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.packages]
"apt:build-essential" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:ca-certificates" = "latest"
"apt:gnupg" = "latest"
"apt:openssh-client" = "latest"

"brew:git" = "latest"
"brew:jj" = "latest"
"brew:mas" = "latest"
"brew:mprocs" = "latest"
"brew:terminal-notifier" = "latest"
"brew:watchman" = "latest"
"brew:xorriso" = "latest"
"brew:yazi" = "latest"
"brew:zsh" = "latest"

"brew-cask:1password-cli" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:atuin-desktop" = "latest"
"brew-cask:bruno" = "latest"
# "brew-cask:cyberduck" = "latest"
"brew-cask:dbeaver-community" = "latest"
"brew-cask:firefox@developer-edition" = "latest"
"brew-cask:flux-app" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:ghostty" = "latest"
"brew-cask:github" = "latest"
# "brew-cask:gpg-suite-no-mail" = "latest"
# "brew-cask:keybase" = "latest"
"brew-cask:macpass" = "latest"
"brew-cask:podman-desktop" = "latest"
"brew-cask:todoist-app" = "latest"
"brew-cask:visual-studio-code" = "latest"

"mas:1518425043" = "latest" # Boop
"mas:6454431289" = "latest" # CrystalFetch
"mas:411643860" = "latest" # DaisyDisk
"mas:430798174" = "latest" # HazeOver
"mas:441258766" = "latest" # Magnet
"mas:425424353" = "latest" # The Unarchiver
"mas:497799835" = "latest" # Xcode

[dotfiles]
"~/.agents/skills" = { mode = "symlink" }
"~/.claude/agents" = { mode = "track" }
"~/.claude/settings.json" = { mode = "track" }
"~/.claude/skills" = { source = "~/src/btp/dotfiles/.agents/skills", mode = "symlink", variants = [{ profile = "work" }] }
"~/.claude/statusline-command.sh" = { mode = "track" }
"~/.config/1Password" = { mode = "symlink" }
"~/.config/atuin/config.toml" = { mode = "symlink" }
"~/.config/fnox/config.toml" = { mode = "symlink" }
"~/.config/gh" = { mode = "symlink-each", manifest = "git" }
"~/.config/gh/hosts.yml" = { mode = "track" }
"~/.config/ghostty/config" = { mode = "symlink" }
"~/.config/git/btp.gitconfig" = { mode = "symlink" }
"~/.config/git/config" = { mode = "template" }
"~/.config/git/ignore" = { mode = "symlink" }
"~/.config/git/work.gitconfig" = { mode = "symlink" }
"~/.config/gpg/gpg-agent.conf" = { mode = "symlink" }
"~/.config/gpg/gpg.conf" = { mode = "symlink" }
"~/.config/homebrew/Brewfile" = { mode = "symlink" }
"~/.config/jj/config.toml" = { mode = "symlink" }
"~/.config/kube/config" = { mode = "track" }
"~/.config/mise" = { mode = "symlink-each", manifest = "git" }
"~/.config/opencode/cli.json" = { mode = "symlink" }
"~/.config/opencode/opencode.jsonc" = { mode = "symlink" }
"~/.config/opencode/plugins/caffeinate.ts" = { mode = "symlink" }
"~/.config/opencode/plugins/issue-tools.ts" = { source = "~/src/btp/agent-tools/issue-tools-opencode/src/index.ts", mode = "symlink" }
"~/.config/opencode/plugins/workmux-status.ts" = { mode = "symlink" }
"~/.config/opencode/skills" = { source = "~/src/btp/dotfiles/.agents/skills", mode = "symlink" }
"~/.config/opencode/tui.json" = { mode = "symlink" }
"~/.config/starship/starship.toml" = { mode = "symlink" }
"~/.config/workmux/config.yaml" = { mode = "symlink" }
"~/.config/zellij" = { mode = "symlink" }
"~/.config/zsh" = { mode = "symlink-each", manifest = "git" }
"~/.mcp.json" = { mode = "symlink", variants = [{ profile = "work" }] }
"~/.pi/agent/agents" = { source = "~/src/btp/agent-tools/subagent-pi/agents", mode = "symlink" }
"~/.pi/agent/extensions/issue-tools-pi" = { source = "~/src/btp/agent-tools/issue-tools-pi", mode = "symlink" }
"~/.pi/agent/extensions/subagent-pi" = { source = "~/src/btp/agent-tools/subagent-pi", mode = "symlink" }
"~/.pi/agent/prompts" = { source = "~/src/btp/agent-tools/subagent-pi/prompts", mode = "symlink" }
"~/.pi/agent/skills" = { source = "~/src/btp/dotfiles/.agents/skills", mode = "symlink" }
"~/.ssh/config" = { source = "~/src/btp/dotfiles/.config/ssh/config", mode = "symlink" }
"~/.zprezto-contrib" = { mode = "symlink" }
"~/.zshenv" = { mode = "symlink" }
"~/AGENTS.md" = { source = "~/src/btp/dotfiles/home/AGENTS.md", mode = "symlink" }
"~/CLAUDE.md" = { mode = "symlink", variants = [{ profile = "work" }] }

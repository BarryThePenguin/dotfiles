[settings]
trusted_config_paths = ["~/src/btp"]

[env]
HOLODECK_SSL_CERT_PATH = "/Users/jonno/holodeck-localhost.pem"
HOLODECK_SSL_KEY_PATH = "/Users/jonno/holodeck-localhost-key.pem"
# Every CLI and MCP server in ~/src/btp/agent-tools that is built on
# telemetry-core emits here, with no per-tool code: startCli() only starts the
# SDK when an OTLP endpoint is named, and the exporters read these variables.
# Collector and its access rules: homelab/docs/otel-collector.md.
#
# Was http://localhost:4317 + grpc + 500ms — a leftover local-collector
# experiment with nothing listening, so every tool's export was a silent no-op.
# HTTP, not gRPC: the public door is a Cilium Gateway + Cloudflare tunnel, and
# gRPC there would need an h2c backend route. 5s, not 500ms: a batch that has
# to cross the tunnel must not be dropped for being slower than a local one.
OTEL_EXPORTER_OTLP_ENDPOINT = "https://otel.jonno.dev"
OTEL_EXPORTER_OTLP_PROTOCOL = "http/protobuf"
OTEL_EXPORTER_OTLP_TIMEOUT = "5000"
# Keep laptop telemetry distinguishable from anything in-cluster, which the
# collector labels `homelab` when a sender says nothing.
OTEL_RESOURCE_ATTRIBUTES = "deployment.environment=local"
# Cloudflare Access service token — the public door's only credential. These
# two come from fnox (global config, `OpenTelemetry Ingest`), and the header is
# blank when they are absent; see the note in docs/otel-collector.md about
# getting them into a shell, since fnox's hook is project-scoped.
OTEL_EXPORTER_OTLP_HEADERS = "CF-Access-Client-Id=${OTEL_CF_ACCESS_CLIENT_ID:-},CF-Access-Client-Secret=${OTEL_CF_ACCESS_CLIENT_SECRET:-}"

[bootstrap]
dotfile_groups = ["home"]

[bootstrap.macos.launchd.agents.hub]
program = "~/.local/share/mise/shims/fnox"
args = ["exec", "--", "/Users/jonno/.local/share/mise/shims/hub", "serve"]
run_at_load = true
keep_alive = true
environment = { HUB_HOME = "/Users/jonno/src/btp/life", PATH = "/Users/jonno/.local/share/mise/shims:/Users/jonno/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
working_directory = "~/src/btp/life"
stdout_path = "~/Library/Logs/hub.log"
stderr_path = "~/Library/Logs/hub.err.log"

[bootstrap.macos.launchd.agents.life-sync-watch]
program = "~/.local/bin/mise"
args = ["watch", "sync"]
run_at_load = true
keep_alive_on_failure = true
throttle_interval = 60
nice = 10
environment = { DOTFILES = "/Users/jonno/src/btp/dotfiles", PATH = "/Users/jonno/.local/share/mise/shims:/Users/jonno/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
working_directory = "~/src/btp/life"
stdout_path = "~/Library/Logs/life-sync.log"
stderr_path = "~/Library/Logs/life-sync.err.log"

[bootstrap.macos.launchd.agents.life-sync]
program = "~/.local/bin/mise"
args = ["run", "sync"]
start_interval = 600
nice = 10
environment = { DOTFILES = "/Users/jonno/src/btp/dotfiles", PATH = "/Users/jonno/.local/share/mise/shims:/Users/jonno/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
working_directory = "~/src/btp/life"
stdout_path = "~/Library/Logs/life-sync.log"
stderr_path = "~/Library/Logs/life-sync.err.log"

[bootstrap.packages]
"brew-cask:headlamp" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:opencode-desktop" = "latest"
"brew-cask:utm" = "latest"
"brew-cask:zed" = "latest"

[tools]
"github:SigNoz/signoz-mcp-server" = "v0.17.0"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"], auto_update = true }
copilot = "v1.0.105"
cosign = "3.1.4"
deno = "2.9.8"
flux-operator = "0.62.1"
helm = "4.3.1"
kind = "0.33.0"
kubectl = "1.37.1"
lima = "2.2.1"
slsa-verifier = "2.7.1"

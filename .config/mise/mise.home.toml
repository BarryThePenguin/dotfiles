[settings]
trusted_config_paths = ["~/src/btp"]

[env]
HOLODECK_SSL_CERT_PATH = "/Users/jonno/holodeck-localhost.pem"
HOLODECK_SSL_KEY_PATH = "/Users/jonno/holodeck-localhost-key.pem"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317"
OTEL_EXPORTER_OTLP_PROTOCOL = "grpc"

[bootstrap.packages]
"brew-cask:headlamp" = "latest"
"brew-cask:notion" = "latest"
"brew-cask:opencode-desktop" = "latest"
"brew-cask:utm" = "latest"
"brew-cask:zed" = "latest"

[tools]
"github:SigNoz/signoz-mcp-server" = "v0.15.0"
"npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"], auto_update = true }
cosign = "3.1.3"
copilot = "v1.0.91"
deno = "2.9.7"
flux-operator = "0.61.0"
kubectl = "1.37.1"
slsa-verifier = "2.7.1"

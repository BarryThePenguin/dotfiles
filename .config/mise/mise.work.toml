[settings]
trusted_config_paths = ["~/src/btp", "~/src/work"]

[bootstrap]
dotfile_groups = ["work"]

[bootstrap.packages]
"brew:awscli" = "latest"
"brew:bash" = "latest"
"brew:fzf" = "latest"
# "brew:showpad/gitlab/assume-it" = "latest"
# "brew:showpad/gitlab/connect-it" = "latest"
"brew-cask:session-manager-plugin" = "latest"

"mas:490179405" = "latest" # Okta Verify

# [bootstrap.brew.taps]
# "showpad/gitlab" = "git@gitlab.com:showpad-code/devops/homebrew.git"

[bootstrap.macos.launchd.agents.otelcol]
program = "~/.local/share/mise/shims/fnox"
args = ["exec", "--profile", "work", "--only", "OTEL_CF_*", "--", "/Users/jonno/.local/share/mise/shims/otelcol-contrib", "--config", "/Users/jonno/.config/otelcol/config.yaml"]
run_at_load = true
keep_alive = true
environment = { OTEL_SDK_DISABLED = "true", PATH = "/Users/jonno/.local/share/mise/shims:/Users/jonno/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
stdout_path = "~/Library/Logs/otelcol.log"
stderr_path = "~/Library/Logs/otelcol.err.log"

# Standalone Aspire dashboard the collector forwards to. UI http://localhost:18888;
# anonymous, bound to localhost. OTLP is on 18889/18890 so the collector keeps
# the standard 4317/4318. OTEL_SDK_DISABLED: the global OTEL_EXPORTER_OTLP_ENDPOINT would
# make the dashboard export its own telemetry to the collector, which feeds it
# back to the dashboard (a loop of ~18 spans/s).
[bootstrap.macos.launchd.agents.aspire-dashboard]
program = "~/.local/share/mise/shims/aspire"
args = ["dashboard", "run", "--allow-anonymous", "--otlp-grpc-url", "http://localhost:18889", "--otlp-http-url", "http://localhost:18890", "--frontend-url", "http://localhost:18888", "--nologo", "--non-interactive"]
run_at_load = true
keep_alive = true
environment = { OTEL_SDK_DISABLED = "true", PATH = "/Users/jonno/.local/share/mise/shims:/Users/jonno/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
stdout_path = "~/Library/Logs/aspire-dashboard.log"
stderr_path = "~/Library/Logs/aspire-dashboard.err.log"

[bootstrap.macos.launchd.agents.hub]
program = "~/.local/share/mise/shims/fnox"
args = ["exec", "--profile", "work", "--", "/Users/jonno/.local/bin/hub", "serve"]
run_at_load = true
keep_alive = true
environment = { HUB_HOME = "/Users/jonno/src/assistant", PATH = "/Users/jonno/.local/share/mise/shims:/Users/jonno/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
working_directory = "~/src/assistant"
stdout_path = "~/Library/Logs/hub.log"
stderr_path = "~/Library/Logs/hub.err.log"

[bootstrap.macos.launchd.agents.assistant-sync-watch]
program = "~/.local/bin/mise"
args = ["watch", "sync"]
run_at_load = true
keep_alive_on_failure = true
throttle_interval = 60
nice = 10
environment = { DOTFILES = "/Users/jonno/src/btp/dotfiles", PATH = "/Users/jonno/.local/share/mise/shims:/Users/jonno/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
working_directory = "~/src/assistant"
stdout_path = "~/Library/Logs/assistant-sync.log"
stderr_path = "~/Library/Logs/assistant-sync.err.log"

[bootstrap.macos.launchd.agents.assistant-sync]
program = "~/.local/bin/mise"
args = ["run", "sync"]
start_interval = 600
nice = 10
environment = { DOTFILES = "/Users/jonno/src/btp/dotfiles", PATH = "/Users/jonno/.local/share/mise/shims:/Users/jonno/.local/bin:/opt/homebrew/bin:/usr/bin:/bin" }
working_directory = "~/src/assistant"
stdout_path = "~/Library/Logs/assistant-sync.log"
stderr_path = "~/Library/Logs/assistant-sync.err.log"

[env]
DOCKER_HOST = "unix:///var/run/docker.sock" # "unix://$(podman machine inspect --format '{{.ConnectionInfo.PodmanSocket.Path}}')"
TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE = "/var/run/docker.sock"
TESTCONTAINERS_RYUK_DISABLED = "true"
CI_JOB_TOKEN = "${GITLAB_TOKEN:-}"
NPM_TOKEN = "${GITLAB_TOKEN:-}"
FNOX_PROFILE = "work"

[tools]
"dotnet:csharp-ls" = "0.28.0"
"dotnet:dotnet-ef" = "10.0.14"
"dotnet:ilspycmd" = "11.2.0.10050"
"github:DataDog/pup" = "v2.4.2"
"npm:@augmentcode/auggie" = "0.37.1"
aspire = "v13.6.4"
aws-cli = { version = "2.39.6", symlink_bins = "true" }
claude-code = { version = "latest", auto_update = true }
databricks-cli = "v1.24.0"
dotnet = "10.0.402"
git-lfs = "3.8.1"
glab = "v1.127.0"
twg = { version = "1.3.9", bin = "twg", checksum_url = "https://teamwork-graph.atlassian.com/cli/SHA256SUMS-v{{ version }}", platforms = { windows-arm64 = { bin = "twg.exe", url = "https://teamwork-graph.atlassian.com/cli/twg-windows-arm64-v{{ version }}.exe" }, windows-x64 = { bin = "twg.exe", url = "https://teamwork-graph.atlassian.com/cli/twg-windows-x64-v{{ version }}.exe" } }, url = 'https://teamwork-graph.atlassian.com/cli/twg-{{ os(macos="darwin") }}-{{ arch() }}-v{{ version }}', version_date_expr = "[[fromJSON(body).version, fromJSON(body).publishedAt]]", version_json_path = ".version", version_list_url = "https://teamwork-graph.atlassian.com/cli/manifest.json" }
viteplus = "1.5.1"

[tools."http:coderabbit"]
version = "0.9.0"

[tools."http:coderabbit".platforms]
macos-arm64 = { url = "https://cli.coderabbit.ai/releases/{{version}}/coderabbit-darwin-arm64.zip" }
macos-x64 = { url = "https://cli.coderabbit.ai/releases/{{version}}/coderabbit-darwin-x64.zip" }
linux-arm64 = { url = "https://cli.coderabbit.ai/releases/{{version}}/coderabbit-linux-arm64.zip" }
linux-x64 = { url = "https://cli.coderabbit.ai/releases/{{version}}/coderabbit-linux-x64.zip" }
